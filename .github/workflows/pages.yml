name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - name: Check that the linked release is public
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version package.json)"
          if gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Waiting for $tag to be published before deploying download links."
          fi

  deploy:
    needs: check-release
    if: needs.check-release.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
