name: Release

# 发版 workflow：打 tag 时触发，tauri-action 自动 build + 上传到 GitHub Release
#
# 触发：push 形如 v2.0.3、v1.2.3 的 tag
#   git tag v2.0.3
#   git push origin v2.0.3
#
# 与 ci.yml 区别：
#   ci.yml 每次 push/PR 都跑（验证用，debug build）
#   release.yml 只在打 tag 时跑（产 release 包，release build + 上传）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # 支持手动触发（GitHub 页面点 Run workflow，需填发布 tag）
    inputs:
      tagName:
        description: '发布 tag（形如 v2.0.4）'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tagName || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tagName || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Validate tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Verify package versions
        run: |
          python - <<'PY'
          import json, os, pathlib, tomllib
          expected = os.environ["RELEASE_TAG"][1:]
          for file in ["package.json", "package-lock.json", "src-tauri/tauri.conf.json", "src-tauri/Cargo.toml"]:
              text = pathlib.Path(file).read_text()
              version = tomllib.loads(text)["package"]["version"] if file.endswith(".toml") else json.loads(text)["version"]
              if version != expected:
                  raise SystemExit(f"{file}: expected {expected}, found {version}")
          PY
      - name: Prepare one draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json apiUrl,isDraft > "$RUNNER_TEMP/release.json"; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG — Prompt Pocket" --notes-from-tag
            gh release view "$RELEASE_TAG" --json apiUrl,isDraft > "$RUNNER_TEMP/release.json"
          fi
          jq -e '.isDraft' "$RUNNER_TEMP/release.json" >/dev/null
          echo "id=$(jq -r '.apiUrl | split("/") | last' "$RUNNER_TEMP/release.json")" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    permissions:
      contents: write   # tauri-action 需要写权限创建 Release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon（M1+，覆盖当前主流 Mac）
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin -- --locked'
          # Windows x64
          - platform: 'windows-latest'
            args: '-- --locked'
          # Linux x64
          - platform: 'ubuntu-22.04'
            args: '-- --locked'
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Frontend quality gate (check + test)
        run: |
          npm ci
          npm run check
          npm test

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 需要额外的目标架构（aarch64）
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 质量门（Rust）：需在系统依赖 + 工具链就绪后跑
      - name: Rust quality gate (test + clippy)
        working-directory: src-tauri
        run: |
          cargo test --locked --verbose
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build and upload to draft
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:

          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify packages and publish
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/release.json"
          jq -e '.isDraft and ([.assets[] | select(.size > 0) | .name] as $names
            | all([".dmg", ".app.tar.gz", "-setup.exe", ".msi", ".deb", ".rpm", ".AppImage"][];
                . as $suffix | any($names[]; endswith($suffix))))' "$RUNNER_TEMP/release.json" > /dev/null
          gh release edit "$RELEASE_TAG" --draft=false --latest
